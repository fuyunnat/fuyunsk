name: Validate skill integration

on:
  push:
    branches:
      - codex/matt-skills-methods-20260904

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-skill.js
      - run: git diff --check HEAD^ HEAD
