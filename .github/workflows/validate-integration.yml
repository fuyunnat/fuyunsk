name: Validate skill integration

on:
  push:
    branches:
      - codex/matt-skills-methods-20260904

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9df62b40b0d07432a7629f33d1a9610a452826e8
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git rev-parse HEAD)" = "9df62b40b0d07432a7629f33d1a9610a452826e8"
      - run: node scripts/validate-skill.js
      - run: git diff --check HEAD^ HEAD
