name: 中文规范重构验证
on:
  push:
    branches: [refactor/chinese-source-preservation-20260905]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      BASE_SHA: 36f9f3b4afa1c63da67d09fcf4267a8e88b738b2
      EXPECTED_TREE: 111217aed09f0512af66a7f38d9d9579c80e9994
      REBUILD_REV: ${{ github.sha }}
      TASK_BRANCH: refactor/chinese-source-preservation-20260905
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 36f9f3b4afa1c63da67d09fcf4267a8e88b738b2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 还原已验证的重构源码
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$REBUILD_REV"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path, PurePosixPath
          rev = os.environ['REBUILD_REV']
          encoded = b''.join(subprocess.check_output(['git', 'show', f'{rev}:.github/rebuild-transfer/part{i}.txt']).strip() for i in range(1, 4))
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'b51bd0af28b6a1cc989348abb0a788b80d2cf1168bb2ba278f1f5385fc9988d2', '传输校验不一致'
          payload = json.loads(lzma.decompress(packed))
          assert payload['base'] == os.environ['BASE_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == payload['base']
          assert len(payload['files']) == 36
          sources = {}
          for name, spec in payload['files'].items():
              p = PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              assert p.parts[0] in ('AGENTS.md', 'README.md', 'global-AGENTS.example.md', 'docs', 'scripts', 'skills', 'tests')
              src = spec['source']
              if src and src not in sources:
                  sources[src] = subprocess.check_output(['git', 'show', f"{payload['base']}:{src}"]).decode('utf-8').splitlines(keepends=True)
              old = sources[src] if src else []
              parts = []
              for part in spec['parts']:
                  if isinstance(part, list):
                      assert len(part) == 2 and 0 <= part[0] <= part[1] <= len(old)
                      parts.append(''.join(old[part[0]:part[1]]))
                  else:
                      assert isinstance(part, str)
                      parts.append(part)
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(''.join(parts).encode('utf-8'))
          print('36 个源文件已通过固定基线还原；不包含凭证、压缩包或临时工作流。')
          PY
          node scripts/build-rules.js
      - name: 验证完整源码树与交付包一致
        run: |
          set -euo pipefail
          git add -- AGENTS.md README.md global-AGENTS.example.md docs scripts skills tests
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
          git diff --cached --stat
      - name: 运行原文保真与功能自检
        run: node scripts/validate-skill.js
      - name: 只保存验证后的任务分支，不修改主线
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          current=$(git ls-remote origin "refs/heads/$TASK_BRANCH" | cut -f1)
          test "$current" = "$REBUILD_REV"
          commit=$(printf '%s\n' 'refactor(skill): 保存已验证的中文原文保真重构' | git commit-tree "$EXPECTED_TREE" -p "$REBUILD_REV")
          basic=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push origin "$commit:refs/heads/$TASK_BRANCH"
          printf '已验证提交：%s\n源码树：%s\n' "$commit" "$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
