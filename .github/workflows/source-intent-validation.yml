name: 源码依据与需求边界验证
on:
  push:
    branches: [fix/source-grounded-intent]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 还原固定基线并校验补丁
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          payload = ''.join(Path(f'.source-intent-transfer/{i}.b64').read_text().strip() for i in range(4))
          data = gzip.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(data).hexdigest() == '4be32b8ebea1b9c4508e55de52a1d78f64ad4b3c480b7677b1a1edd04e7a22da', '补丁内容不一致'
          Path('/tmp/source-intent.patch').write_bytes(data)
          PY
          target=$(mktemp -d)
          git worktree add --detach "$target" 3f287410c90568af94faedcf77a694ac19a91ff8
          git -C "$target" apply --index /tmp/source-intent.patch
          test "$(git -C "$target" write-tree)" = 89d9c965989f52f852ab2c8d773f81897cedf54a
          echo "TARGET=$target" >> "$GITHUB_ENV"
      - name: 验证源码依据、原文保真和旧行为
        shell: bash
        run: |
          set -euo pipefail
          cd "$TARGET"
          node scripts/validate-skill.js
          git diff --cached --check
          git diff --exit-code
          test "$(git write-tree)" = 89d9c965989f52f852ab2c8d773f81897cedf54a
      - name: 只保存验证后的任务源码，不修改主线
        shell: bash
        run: |
          set -euo pipefail
          result=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree 89d9c965989f52f852ab2c8d773f81897cedf54a -p "$GITHUB_SHA" -m 'fix(skill): 保存源码依据与需求边界验证结果')
          git push origin "$result:refs/heads/fix/source-grounded-intent"
