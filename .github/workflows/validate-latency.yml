name: 批量读取与前端选型验证
on:
  push:
    branches: [perf/batched-rule-loading]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 还原固定基线上的已审查补丁
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/perf/batched-rule-loading
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          source = Path(os.environ['GITHUB_WORKSPACE']) / '.delivery'
          encoded = ''.join((source / f'part-{i}.txt').read_text() for i in range(1, 6))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'f6b4d61ad80564ead14210fb39b4e11233bdedd8643ec3ac75a318bdbb1a7d1c'
          (Path(os.environ['RUNNER_TEMP']) / 'skill-publication.patch').write_bytes(patch)
          PY
          TARGET="$RUNNER_TEMP/skill-validated-$GITHUB_RUN_ID"
          git worktree add --detach "$TARGET" 4fbf07b54a48c0520b379908b97f0c39f670312e
          git -C "$TARGET" apply --check "$RUNNER_TEMP/skill-publication.patch"
          git -C "$TARGET" apply --index "$RUNNER_TEMP/skill-publication.patch"
          test "$(git -C "$TARGET" write-tree)" = 936d6784a8a5ad62791a7b12d271e2a1135e1242
      - name: 验证原文保真、批量读取、前端选型与差异
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/skill-validated-$GITHUB_RUN_ID"
          node scripts/validate-skill.js
          git diff --cached --check
          git diff --exit-code
          test "$(git write-tree)" = 936d6784a8a5ad62791a7b12d271e2a1135e1242
      - name: 只保存已验证源码到任务分支
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/perf/batched-rule-loading
          TARGET="$RUNNER_TEMP/skill-validated-$GITHUB_RUN_ID"
          TREE=$(git -C "$TARGET" write-tree)
          test "$TREE" = 936d6784a8a5ad62791a7b12d271e2a1135e1242
          COMMIT=$(printf '%s\n' 'perf(skill): 保存批量读取与前端选型验证结果' | git -C "$TARGET" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$TREE" -p "$GITHUB_SHA")
          git push origin "$COMMIT:refs/heads/perf/batched-rule-loading"
          printf '已保存源码树：%s\n任务提交：%s\n' "$TREE" "$COMMIT"
