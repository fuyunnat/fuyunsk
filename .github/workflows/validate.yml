name: 中文工程技能自检

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20'
            suite: full
          - os: ubuntu-latest
            node: '22'
            suite: full
          - os: macos-latest
            node: '22'
            suite: full
          - os: windows-latest
            node: '22'
            suite: portable
    steps:
      - name: 获取仓库源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 完整技能自检（Linux/macOS）
        if: matrix.suite == 'full'
        run: node scripts/validate-skill.js
      - name: Windows 只读诊断与跨平台契约
        if: matrix.suite == 'portable'
        run: |
          node --test tests/doctor.test.js tests/natural-language-invocation.test.js
          node scripts/build-rules.js --check
          node skills/production-engineering/scripts/doctor.js --help
      - name: 检查 Git 差异空白错误
        run: git diff --check HEAD^ HEAD
