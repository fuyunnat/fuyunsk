name: 根目录工作清单验证
on:
  push:
    branches: [feat/root-workflow-20260906]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 从固定基线还原已审查源码
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = fuyunnat/fuyunsk
          test "$GITHUB_REF_NAME" = feat/root-workflow-20260906
          git worktree add --detach "$RUNNER_TEMP/root-workflow-candidate" 9fc57556ec0ccd53c5ad10199fbc72c44092789c
          python3 - "$RUNNER_TEMP/root-workflow-candidate" "$GITHUB_WORKSPACE" <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess, sys
          root, transfer = map(Path, sys.argv[1:])
          ops = []
          for index in range(3):
              ops.extend(json.loads((transfer / f'.github/workflow-transfer-{index}.json').read_text()))
          expected = ['AGENTS.md', 'README.md', 'docs/ai-installation.md', 'docs/personal-custom-instructions.md', 'global-AGENTS.example.md', 'scripts/validate-skill.js', 'skills/production-engineering/SKILL.md', 'skills/production-engineering/references/context-memory-continuity.md', 'skills/production-engineering/references/project-migration.md', 'skills/production-engineering/references/routing.md', 'skills/production-engineering/references/source-policy.md', 'skills/production-engineering/references/task-lanes.md', 'skills/production-engineering/references/workflow-checklist.md', 'skills/production-engineering/scripts/rule-batch.js', 'skills/production-engineering/templates/workflow.example.md', 'tests/workflow-checklist.test.js', '工作流程.md']
          assert sorted(o['path'] for o in ops) == sorted(expected), '文件集合不符'
          for op in ops:
              file = root / op['path']
              assert not file.is_symlink(), '拒绝符号链接'
              if op['before'] is None:
                  assert not file.exists(), '新文件已存在'
                  body = ''
              else:
                  raw = file.read_bytes()
                  assert hashlib.sha256(raw).hexdigest() == op['before'], '基线哈希不符：' + op['path']
                  body = raw.decode('utf-8')
              end = len(body)
              for first, last, addition in sorted(op['edits'], reverse=True):
                  assert 0 <= first <= last <= end, '编辑范围无效'
                  body = body[:first] + addition + body[last:]
                  end = first
              result = body.encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == op['after'], '结果哈希不符：' + op['path']
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_bytes(result)
          subprocess.run(['git', '-C', str(root), 'add', '--', *expected], check=True)
          tree = subprocess.check_output(['git', '-C', str(root), 'write-tree'], text=True).strip()
          assert tree == '6c222ceb1e25f2e6acfb8b29c8ba91e7aacfc99c', '源码树与本地验证不一致'
          print('已还原17份文件；源码树一致：' + tree)
          PY
      - name: 验证根目录清单、原文保真与旧行为
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/root-workflow-candidate"
          node --check tests/workflow-checklist.test.js
          node scripts/validate-skill.js
          git diff --cached --check
          git diff --cached --stat
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files -o --exclude-standard)"
          test "$(git write-tree)" = 6c222ceb1e25f2e6acfb8b29c8ba91e7aacfc99c
      - name: 只保存已验证源码到任务分支
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/root-workflow-candidate"
          TREE=$(git write-tree)
          COMMIT=$(printf '%s\n' 'feat(skill): 保存当前项目根目录工作清单与验证结果' | git commit-tree "$TREE" -p "$GITHUB_SHA")
          echo "VERIFIED_TREE=$TREE"
          echo "VERIFIED_COMMIT=$COMMIT"
          git push origin "$COMMIT:refs/heads/feat/root-workflow-20260906"
