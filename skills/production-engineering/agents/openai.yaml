interface:
  display_name: "生产级工程"
  short_description: "完成工程目标或生成目标提示词，按需读取规则，保护数据与项目边界"
  default_prompt: "使用 $production-engineering；先按 SKILL.md 判别“目标提示词”只输出分支：独立口令或明确要求生成才命中，讨论/修改该约定不算；命中仅按已有上下文给可复制、独立可用的目标提示词，含必做、验收及完成即停；缺资料用【待补】模板，不追问；输出后停，不启动目标、不执行代码/改文件/建清单/开面板/调用目标工具；其余工程请求用户只需说结果，口语短句也按当前项目理解；先评估目标、证据、候选方案、成本风险和验收，再按 SKILL.md 的实施流程和适用专项执行；明确授权不重复确认，验证后简短交付并停止。"
policy:
  allow_implicit_invocation: true
