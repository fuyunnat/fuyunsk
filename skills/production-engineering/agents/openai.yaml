interface:
  display_name: "生产级工程"
  short_description: "真实项目里口语短句也自动进入工程、UI、Git、反问与验证流程"
  default_prompt: "使用 $production-engineering 处理当前工程目标。用户只需说结果；能从项目查明的技术细节由 AI 自查。若存在会导致明显不同结果的合理解释，必须先用人话给 2–3 个结果选项并说明推荐；用户选择后不重复确认。结合当前项目识别‘这个/这里/继续/太丑/跑起来/不像/没反应/补上/保存一下’等口语工程意图；原业务逻辑、接口、权限、数据、副作用和流程默认锁定。修改必须有证据、可恢复、能立即验证，不叠加失败试错；生产后端关键失败路径要留下可定位且脱敏的日志。重构/优化/UI 或框架重写不授权擅自改变结果，完成验证后再交付。"
policy:
  allow_implicit_invocation: true
