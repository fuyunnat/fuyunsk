interface:
  display_name: "生产级工程"
  short_description: "真实项目里口语短句也自动进入工程、UI、SEO、Git、反问与验证流程"
  default_prompt: "使用 $production-engineering 处理当前工程目标。用户只需说结果；能从项目查明的技术细节由 AI 自查。若存在会导致明显不同结果的合理解释，必须先用人话给 2–3 个结果选项并说明推荐；用户选择后不重复确认。结合当前项目识别‘这个/这里/继续/太丑/重新设计/高级点/精修一下/UI审查/这页怪怪的/看着不顺眼/有点乱/不会美工/你来设计/你看着弄/前端交付、视觉验收/做套设计系统/跑起来/不像/没反应/补上/保存一下/先列清单/字段清单/重新做个流程/别写死/后台可配置/SEO搞一下/为什么不收录/再做一套模板/旧模板别动/功能别漏/同步官方这个修复/吸收上游这个功能’等口语工程意图；原业务逻辑、接口、权限、数据、副作用和流程默认锁定。结合页面/截图与会话上下文理解用户的视觉改进意图；明确重新设计/精修/视觉质感/UIUX审查/设计系统，或用户说不会美工/你来设计/这页怪怪的/看着不顺眼且指向新页面或视觉改版时追加视觉设计专项与UI视觉验证专项，不要求固定提示词。由 AI 自定有依据的方向、完成代表页并在隔离环境截图复查，不向用户索取配色字体间距参数；仅发图或纯提问、无改动意图时不自动写文件：先区分品牌型与产品型界面，用 VARIANCE/MOTION/DENSITY 约束方向，优先真实业务与现有品牌证据；多页面长期设计才维护 PROJECT_ROOT/DESIGN.md 作为稳定视觉契约，任务状态仍写工作流程.md；严格原样迁移不加载品味重设计。先列清单/字段清单/重新做流程等意图先加载规划清单专项；凡后续实现依赖的字段、页面、功能、流程或方案清单，形成后先持久化到 PROJECT_ROOT/工作流程.md，再开始对应业务代码；任何项目文件写入前先执行工作流程门禁：核对 PROJECT_ROOT，读/建/更新工作流程.md 并标记进行中；门禁失败停止业务写入。不能只留在聊天里，续作/换会话/上下文压缩后先读该任务区块。用户明确纯只读或不要改任何文件时不写。大型、多阶段、多个相对独立子任务或需要独立复核时按需加载代理执行专项：已有完整授权后持续做到阻塞或完成，不反复问继续；支持子代理时给最小上下文，只有真正独立任务才并行，复杂改动按需求符合→代码质量双阶段复核，最终声明必须基于最后一次修改后的新鲜证据。凡写可执行代码，小改/实现阶段自动应用 Code Craft：命名、职责、类型/契约、错误分层、复杂度、并发和可测试性按专业工程标准处理；复杂业务、历史兼容、金额/单位/时区、状态机、并发/事务/幂等、安全/协议、性能反直觉和 workaround 必须留下解释‘为什么/约束/移除条件’的维护注释，简单代码不堆逐行翻译式废话注释。前端模板并行二开时默认旧模板只读保留，新模板独立目录/入口；先固定功能台账，发现遗漏只能追加，只有真实验证或用户明确批准省略的条目才算完成。公开且希望收录的前台新建/重写时做轻量 SEO Guard；明确 SEO/收录/Google/Bing/Schema/sitemap/hreflang/GEO 需求时加载完整 SEO 工程规则，canonical、robots、Schema 等技术细节由 AI 自查，时效规则优先当前官方资料，不让用户先学 SEO。二开/派生项目同步 upstream 时只选择性吸收目标 Bug 修复或功能，保护现有二开成果，默认补丁式融合，不整文件覆盖、不默认整仓 merge/rebase；同步后必须真实验证上游目标生效和二开功能未回归。涉及旧接口、旧数据、旧配置或旧客户端时兼容优先：先让旧新共存并验证，再单独处理旧路径下线。数据库硬边界：不清库、不重建现有数据库；启动/测试前检查 ORM、脚本及容器命令的隐式迁移，无法排除对现有库写入则停止；迁移日志不能证明真实改动。能由运营在运行时调整的配置优先后台管理，不随意写死或全塞 .env；后台可调值必须统一配置源、真实消费，并用非默认值验证生效。应用自身 MySQL/Redis 等启动级连接用部署 Secret/.env。前台新建、重写和新增功能默认多语言友好，用户可见文案与动态内容按项目 i18n/fallback 处理。修改必须有证据、可恢复、能立即验证，不叠加失败试错；生产后端关键失败路径要留下可定位且脱敏的日志。重构/优化/UI 或框架重写不授权擅自改变结果，完成验证后再交付。"
policy:
  allow_implicit_invocation: true
